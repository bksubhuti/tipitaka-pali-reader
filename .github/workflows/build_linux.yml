name: Build on Ubuntu 22.04

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g., v2.9.3+123). Leave empty to use version from pubspec.yaml'
        required: false
        default: ''

# REQUIRED: Grant the action permission to create a release in your repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version and Build Number
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BUILD_NUM=$(echo "$PUBSPEC_VERSION" | sed -E 's/.*\+([0-9]+).*/\1/')
          INPUT_TAG="${{ github.event.inputs.version_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="v${PUBSPEC_VERSION}"
          fi
          echo "PUBSPEC_VERSION=${PUBSPEC_VERSION}" >> $GITHUB_ENV
          echo "BUILD_NUM=${BUILD_NUM}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "Detected Version: ${PUBSPEC_VERSION}"
          echo "Detected Build Number: ${BUILD_NUM}"
          echo "Release Tag Name: ${TAG_NAME}"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl git unzip xz-utils zip libglu1-mesa \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libstdc++-12-dev libfuse2

      - name: Prepare assets directory
        run: mkdir -p assets/database

      - name: Download zip file
        run: |
          mkdir -p assets/database
          curl -L -o assets/database/tipitaka_pali.zip "https://www.dropbox.com/scl/fi/18cwqb6hyr81ws6n8aeyh/tipitaka_pali.db.zip?rlkey=lpiuyk3amqm9hrxpq007sb45m&st=ktchca1x&dl=1"

      - name: Extract zip file
        run: unzip -o assets/database/tipitaka_pali.zip -d assets/database/

      - name: Delete zip file
        run: rm -f assets/database/tipitaka_pali.zip

      - name: Run split.sh script inside assets/database
        run: |
          cd assets/database
          chmod +x split.sh
          ./split.sh

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate .env File for Envied
        shell: bash
        run: |
          cat <<EOF > .env
          FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}"
          OPEN_ROUTER_API_KEY="${{ secrets.OPEN_ROUTER_API_KEY }}"
          DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
          EOF

      - name: Run Build Runner (Envied CodeGen)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate Localization
        run: flutter gen-l10n

      - name: Flutter build (Linux)
        run: flutter build linux --release

      - name: Make build_appimage2.sh executable
        run: chmod +x build_appimage2.sh

      - name: Build AppImage via script
        run: ./build_appimage2.sh

      - name: Package AppImage in tipitaka-pali-reader-linux-pkg
        run: |
          cp tipitaka_pali_reader.AppImage tipitaka-pali-reader-linux-pkg/
          chmod +x tipitaka-pali-reader-linux-pkg/tipitaka_pali_reader.AppImage
          chmod +x tipitaka-pali-reader-linux-pkg/install.sh
          chmod +x tipitaka-pali-reader-linux-pkg/uninstall.sh
          zip -r tipitaka-pali-reader-linux-pkg.zip tipitaka-pali-reader-linux-pkg/
          cp tipitaka-pali-reader-linux-pkg.zip "tipitaka-pali-reader-linux-pkg_${BUILD_NUM}.zip"

      - name: Package Flathub Zip (tpr_${BUILD_NUM}.zip)
        run: |
          # Copy linux release bundle into flathub/bin/
          mkdir -p flathub/bin
          rm -f flathub/bin/empty
          cp -r build/linux/x64/release/bundle/* flathub/bin/
          chmod +x flathub/bin/tipitaka_pali_reader
          
          # Create tpr_${BUILD_NUM}.zip with root-relative contents
          cd flathub
          zip -r "../tpr_${BUILD_NUM}.zip" *
          cd ..
          
          # Calculate SHA256 checksum
          SHA256_TPR_ZIP=$(sha256sum "tpr_${BUILD_NUM}.zip" | awk '{print $1}')
          echo "$SHA256_TPR_ZIP  tpr_${BUILD_NUM}.zip" > "tpr_${BUILD_NUM}.zip.sha256"
          
          echo "SHA256_TPR_ZIP=${SHA256_TPR_ZIP}" >> $GITHUB_ENV
          
          # Summary to Job Log
          echo "### 📦 Flathub Package" >> $GITHUB_STEP_SUMMARY
          echo "- **Archive:** \`tpr_${BUILD_NUM}.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256 Checksum:** \`${SHA256_TPR_ZIP}\`" >> $GITHUB_STEP_SUMMARY

      - name: Extract AppImage and Compress Legacy Bundles
        run: |
          chmod +x tipitaka_pali_reader.AppImage
          ./tipitaka_pali_reader.AppImage --appimage-extract
          mv squashfs-root TPR-Bundle
          chmod +x TPR-Bundle/tipitaka_pali_reader || true
          zip -r TPR-Bundle-Linux.zip TPR-Bundle/
          
          cd build/linux/x64/release/
          zip -r ../../../../linux-build-bundle.zip bundle/
          cd ../../../../

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-packages
          path: |
            tipitaka_pali_reader.AppImage
            tipitaka-pali-reader-linux-pkg.zip
            tipitaka-pali-reader-linux-pkg_*.zip
            tpr_*.zip
            tpr_*.zip.sha256
            TPR-Bundle-Linux.zip
            linux-build-bundle.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Tipiṭaka Pāḷi Reader Linux ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          body: |
            ### Linux Release Assets
            - **Flathub Package:** `tpr_${{ env.BUILD_NUM }}.zip`
            - **Flathub SHA256:** `${{ env.SHA256_TPR_ZIP }}`
            - **AppImage Package:** `tipitaka-pali-reader-linux-pkg.zip`
            - **Standalone AppImage:** `tipitaka_pali_reader.AppImage`
          files: |
            tipitaka_pali_reader.AppImage
            tipitaka-pali-reader-linux-pkg.zip
            tipitaka-pali-reader-linux-pkg_${{ env.BUILD_NUM }}.zip
            tpr_${{ env.BUILD_NUM }}.zip
            tpr_${{ env.BUILD_NUM }}.zip.sha256
            TPR-Bundle-Linux.zip
            linux-build-bundle.zip

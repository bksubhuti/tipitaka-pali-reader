name: Build on Ubuntu 22.04

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g., v2.9.3+123). Leave empty to use version from pubspec.yaml'
        required: false
        default: ''
      data_tag:
        description: 'Release tag that holds the databases (tipitaka_pali.db.tar.bz2, epitaka_part.*, tpr_extension_part.*)'
        required: true
        default: 'sentence-data-2026-09-28'

# REQUIRED: Grant the action permission to create a release in your repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version and Build Number
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BUILD_NUM=$(echo "$PUBSPEC_VERSION" | sed -E 's/.*\+([0-9]+).*/\1/')
          INPUT_TAG="${{ github.event.inputs.version_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="v${PUBSPEC_VERSION}"
          fi
          echo "PUBSPEC_VERSION=${PUBSPEC_VERSION}" >> $GITHUB_ENV
          echo "BUILD_NUM=${BUILD_NUM}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "Detected Version: ${PUBSPEC_VERSION}"
          echo "Detected Build Number: ${BUILD_NUM}"
          echo "Release Tag Name: ${TAG_NAME}"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl git unzip xz-utils zip libglu1-mesa \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libstdc++-12-dev libfuse2

      # The databases come from a GitHub release: tipitaka_pali.db.tar.bz2 is
      # split here, and the epitaka/tpr_extension parts are used as they are.
      - name: Download databases from release ${{ github.event.inputs.data_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_TAG: ${{ github.event.inputs.data_tag }}
        run: |
          set -euo pipefail
          mkdir -p assets/database
          cd assets/database
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${DATA_TAG}" \
            | jq -r '.assets[] | select(.name | test("^(tipitaka_pali\\.db\\.tar\\.bz2|epitaka_part\\..*|tpr_extension_part\\..*)$")) | "\(.name) \(.browser_download_url)"' \
            > assets.txt
          cat assets.txt
          test -s assets.txt
          while read -r name url; do
            echo "Downloading $name"
            curl -fL --retry 3 -o "$name" "$url"
          done < assets.txt
          rm assets.txt

      - name: Extract and split tipitaka_pali.db
        run: |
          set -euo pipefail
          cd assets/database
          tar -xjf tipitaka_pali.db.tar.bz2
          rm tipitaka_pali.db.tar.bz2
          chmod +x split.sh
          ./split.sh

      # A part on disk that pubspec.yaml does not list would be left out of
      # the app silently, and a listed part that is missing fails late, so
      # check that both lists agree before building.
      - name: Check database parts match pubspec.yaml
        run: |
          set -euo pipefail
          grep -oE 'assets/database/[a-z_]+_part\.[a-z]+' pubspec.yaml | sort > expected.txt
          ls assets/database/*_part.* | sort > actual.txt
          ls -l assets/database/
          if ! diff expected.txt actual.txt; then
            echo "::error::Database parts in the release do not match pubspec.yaml (< pubspec, > release)"
            exit 1
          fi
          rm expected.txt actual.txt

      # SHA256SUMS holds the hashes of the parts that were tested locally, so a
      # release that still carries older data fails here instead of shipping.
      - name: Check database parts match SHA256SUMS
        run: |
          set -euo pipefail
          cd assets/database
          sha256sum -c SHA256SUMS

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate .env File for Envied
        shell: bash
        run: |
          cat <<EOF > .env
          FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}"
          OPEN_ROUTER_API_KEY="${{ secrets.OPEN_ROUTER_API_KEY }}"
          DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
          EOF

      - name: Run Build Runner (Envied CodeGen)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate Localization
        run: flutter gen-l10n

      - name: Flutter build (Linux)
        run: flutter build linux --release

      - name: Make build_appimage2.sh executable
        run: chmod +x build_appimage2.sh

      - name: Build AppImage via script
        run: ./build_appimage2.sh

      - name: Package AppImage in tipitaka-pali-reader-linux-pkg
        run: |
          cp tipitaka_pali_reader.AppImage tipitaka-pali-reader-linux-pkg/
          chmod +x tipitaka-pali-reader-linux-pkg/tipitaka_pali_reader.AppImage
          chmod +x tipitaka-pali-reader-linux-pkg/install.sh
          chmod +x tipitaka-pali-reader-linux-pkg/uninstall.sh
          zip -r "tipitaka-pali-reader-linux-pkg_${BUILD_NUM}.zip" tipitaka-pali-reader-linux-pkg/

      - name: Package Flathub Tarball (tpr_${BUILD_NUM}.tar.gz)
        run: |
          # Copy linux release bundle into flathub/bin/
          mkdir -p flathub/bin
          rm -f flathub/bin/empty
          cp -r build/linux/x64/release/bundle/* flathub/bin/
          chmod +x flathub/bin/tipitaka_pali_reader
          
          # Create tpr_${BUILD_NUM}.tar.gz with root-relative contents
          cd flathub
          tar -czvf "../tpr_${BUILD_NUM}.tar.gz" *
          cd ..
          
          # Calculate SHA256 checksum
          SHA256_TPR_TAR=$(sha256sum "tpr_${BUILD_NUM}.tar.gz" | awk '{print $1}')
          echo "$SHA256_TPR_TAR  tpr_${BUILD_NUM}.tar.gz" > "tpr_${BUILD_NUM}.tar.gz.sha256"
          
          echo "SHA256_TPR_TAR=${SHA256_TPR_TAR}" >> $GITHUB_ENV
          
          # Summary to Job Log
          echo "### 📦 Flathub Package" >> $GITHUB_STEP_SUMMARY
          echo "- **Archive:** \`tpr_${BUILD_NUM}.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256 Checksum:** \`${SHA256_TPR_TAR}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-packages
          path: |
            tipitaka-pali-reader-linux-pkg_*.zip
            tipitaka_pali_reader.AppImage
            tpr_*.tar.gz
            tpr_*.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          body: |
            ### Linux Release Assets
            - **Flathub Package:** `tpr_${{ env.BUILD_NUM }}.tar.gz`
            - **Flathub SHA256:** `${{ env.SHA256_TPR_TAR }}`
            - **AppImage Package:** `tipitaka-pali-reader-linux-pkg_${{ env.BUILD_NUM }}.zip`
            - **Standalone AppImage:** `tipitaka_pali_reader.AppImage`
          files: |
            tipitaka-pali-reader-linux-pkg_${{ env.BUILD_NUM }}.zip
            tipitaka_pali_reader.AppImage
            tpr_${{ env.BUILD_NUM }}.tar.gz
            tpr_${{ env.BUILD_NUM }}.tar.gz.sha256

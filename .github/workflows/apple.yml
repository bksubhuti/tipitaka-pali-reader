name: Build Apple (iOS & macOS) and upload to App Store Connect

# Builds, signs and uploads from GitHub's machines, so the upload does not
# go over the local line and no Mac is needed.
#
# Signing uses the team's distribution certificates and App Store profiles,
# kept as secrets; the API key is an individual one (App Manager, limited
# to our apps), which Apple does not let fetch certificates or profiles, so
# it is used only for the upload.
#
# Secrets:
#   APPLE_DIST_P12, APPLE_INSTALLER_P12  base64 .p12 of "Apple Distribution"
#                                        and "3rd Party Mac Developer
#                                        Installer"; APPLE_P12_PASSWORD
#   MACOS_PROFILE, IOS_PROFILE           base64 App Store profiles
#   ASC_KEY_ID, ASC_KEY_P8               the individual API key (.p8 text)
# The certificates and profiles run out after a year (next: Nov 2027);
# make new ones in Xcode and export them again.
#
# After the upload the build shows in App Store Connect / TestFlight; the
# What's New text and the submission are still done there by hand.
#
# platform 'dmg' needs none of this: it makes a .dmg of the macOS app signed
# only to run, not by the team, so macOS asks once to allow it (Privacy &
# Security > Open Anyway).

on:
  workflow_dispatch:
    inputs:
      data_tag:
        description: 'Release tag that holds the databases (tipitaka_pali.db.tar.bz2, epitaka_part.*, tpr_extension_part.*)'
        required: true
        default: 'sentence-data-2026-09-28'
      platform:
        description: 'What to build'
        required: true
        default: 'both'
        type: choice
        options: [both, ios, macos, dmg]
      upload:
        description: 'Upload to App Store Connect (off: build and keep the files only)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  TEAM_ID: 4456F3J27A
  APP_APPLE_ID: '1541426949'

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'

      # The same databases as the Linux build, from the same release.
      - name: Download databases from release ${{ inputs.data_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_TAG: ${{ inputs.data_tag }}
        run: |
          set -euo pipefail
          mkdir -p assets/database
          cd assets/database
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${DATA_TAG}" \
            | jq -r '.assets[] | select(.name | test("^(tipitaka_pali\\.db\\.tar\\.bz2|epitaka_part\\..*|tpr_extension_part\\..*)$")) | "\(.name) \(.browser_download_url)"' \
            > assets.txt
          cat assets.txt
          test -s assets.txt
          while read -r name url; do
            echo "Downloading $name"
            curl -fL --retry 3 -o "$name" "$url"
          done < assets.txt
          rm assets.txt

      - name: Extract and split tipitaka_pali.db
        run: |
          set -euo pipefail
          cd assets/database
          tar -xjf tipitaka_pali.db.tar.bz2
          rm tipitaka_pali.db.tar.bz2
          chmod +x split.sh
          ./split.sh

      - name: Check database parts match pubspec.yaml
        run: |
          set -euo pipefail
          grep -oE 'assets/database/[a-z_]+_part\.[a-z]+' pubspec.yaml | sort > expected.txt
          ls assets/database/*_part.* | sort > actual.txt
          if ! diff expected.txt actual.txt; then
            echo "::error::Database parts in the release do not match pubspec.yaml (< pubspec, > release)"
            exit 1
          fi
          rm expected.txt actual.txt

      - name: Check database parts match SHA256SUMS
        run: |
          set -euo pipefail
          cd assets/database
          shasum -a 256 -c SHA256SUMS

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate .env File for Envied
        run: |
          cat <<EOF > .env
          FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}"
          OPEN_ROUTER_API_KEY="${{ secrets.OPEN_ROUTER_API_KEY }}"
          DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
          EOF

      - name: Run Build Runner (Envied CodeGen)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate Localization
        run: flutter gen-l10n

      # A keychain of its own, so codesign never stops to ask.
      - name: Certificates, profiles and API key
        if: inputs.platform != 'dmg'
        env:
          APPLE_DIST_P12: ${{ secrets.APPLE_DIST_P12 }}
          APPLE_INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_P12 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          MACOS_PROFILE: ${{ secrets.MACOS_PROFILE }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          for c in "$APPLE_DIST_P12" "$APPLE_INSTALLER_P12"; do
            printf '%s' "$c" | base64 -d > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          done
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KC"

          # Each profile goes where Xcode looks, and its name is kept for
          # the export options.
          DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$DIR"
          for p in macos ios; do
            var=$(echo "${p}_PROFILE" | tr a-z A-Z)
            [ -n "${!var:-}" ] || continue
            printf '%s' "${!var}" | base64 -d > "$RUNNER_TEMP/$p.profile"
            security cms -D -i "$RUNNER_TEMP/$p.profile" > "$RUNNER_TEMP/$p.plist"
            uuid=$(plutil -extract UUID raw "$RUNNER_TEMP/$p.plist")
            name=$(plutil -extract Name raw "$RUNNER_TEMP/$p.plist")
            ext=$([ $p = macos ] && echo provisionprofile || echo mobileprovision)
            cp "$RUNNER_TEMP/$p.profile" "$DIR/$uuid.$ext"
            echo "$(echo $p | tr a-z A-Z)_PROFILE_NAME=$name" >> "$GITHUB_ENV"
            echo "$p profile: $name"
          done

          KEY="$RUNNER_TEMP/ApiKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f2)" >> "$GITHUB_ENV"

      # The archive is signed only to run; the export signs it again with
      # the distribution certificate and the App Store profile.
      - name: Build and export macOS
        if: inputs.platform == 'both' || inputs.platform == 'macos'
        run: |
          set -euo pipefail
          flutter build macos --release --config-only
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath build/macos/Runner.xcarchive \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= archive
          cat > "$RUNNER_TEMP/mac-export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>installerSigningCertificate</key><string>3rd Party Mac Developer Installer</string>
            <key>provisioningProfiles</key>
            <dict><key>org.americanmonk.tpp</key><string>${MACOS_PROFILE_NAME}</string></dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/macos/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/mac-export.plist" \
            -exportPath build/macos/export
          ls -l build/macos/export

      - name: Upload macOS
        if: inputs.upload && (inputs.platform == 'both' || inputs.platform == 'macos')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          # An individual key has no issuer; altool wants one given anyway.
          xcrun altool --upload-package build/macos/export/*.pkg -t macos \
            --apple-id "$APP_APPLE_ID" --bundle-version "$BUILD_NUMBER" \
            --bundle-short-version-string "$VERSION_NAME" \
            --api-key "$ASC_KEY_ID" --api-issuer none --api-key-subject user \
            --p8-file-path "$ASC_KEY_PATH"

      # Without a provisioning profile the associated-domains entitlement
      # would stop the app from opening, so it is left out here.
      - name: Build macOS DMG
        if: inputs.platform == 'dmg'
        run: |
          set -euo pipefail
          flutter build macos --release --config-only
          ENT="$RUNNER_TEMP/dmg.entitlements"
          cp macos/Runner/Release.entitlements "$ENT"
          /usr/libexec/PlistBuddy -c 'Delete :com.apple.developer.associated-domains' "$ENT"
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build/macos/dd \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= CODE_SIGN_ENTITLEMENTS="$ENT" build
          APP=$(find build/macos/dd/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          codesign -dv --entitlements - "$APP"
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          mkdir -p build/dmg/src
          cp -R "$APP" build/dmg/src/
          ln -s /Applications build/dmg/src/Applications
          hdiutil create -volname 'Tipitaka Pali Reader' -srcfolder build/dmg/src \
            -format UDZO "build/dmg/TipitakaPaliReader-${VERSION}.dmg"
          rm -rf build/dmg/src

      - name: Keep the DMG
        if: inputs.platform == 'dmg'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/dmg/*.dmg

      - name: Remove the key and keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/ApiKey_*.p8
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      # With upload off, the signed files are kept here for a hand upload.
      - name: Keep the exported files
        if: ${{ !inputs.upload && inputs.platform != 'dmg' }}
        uses: actions/upload-artifact@v4
        with:
          name: apple-export
          path: |
            build/macos/export/
          if-no-files-found: ignore

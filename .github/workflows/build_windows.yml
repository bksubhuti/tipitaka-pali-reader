name: Build Windows (MSIX for the Store, and one to test)

# Builds the Store package on GitHub's Windows machines, from the same
# databases as the other builds, and keeps it for download. It is uploaded
# by hand in Partner Center (Apps and games › the app › new submission ›
# Packages): a Store package needs no signing, the Store signs it. The
# Store API is no use with a personal account.
#
# A second package, signed with a test certificate, is kept beside it for
# installing on a computer by hand first (its README says how).
#
# The version is msix_version in pubspec.yaml, raised at each build
# increment; Partner Center refuses one it has already had.

on:
  workflow_dispatch:
    inputs:
      data_tag:
        description: 'Release tag that holds the databases (tipitaka_pali.db.tar.bz2, epitaka_part.*, tpr_extension_part.*)'
        required: true
        default: 'sentence-data-2026-09-28'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'

      # The same databases as the Linux, Apple and Android builds.
      - name: Download databases from release ${{ inputs.data_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_TAG: ${{ inputs.data_tag }}
        run: |
          set -euo pipefail
          mkdir -p assets/database
          cd assets/database
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${DATA_TAG}" \
            | jq -r '.assets[] | select(.name | test("^(tipitaka_pali\\.db\\.tar\\.bz2|epitaka_part\\..*|tpr_extension_part\\..*)$")) | "\(.name) \(.browser_download_url)"' \
            | tr -d '\r' > assets.txt
          cat assets.txt
          test -s assets.txt
          while read -r name url; do
            echo "Downloading $name"
            curl -fL --retry 3 -o "$name" "$url"
          done < assets.txt
          rm assets.txt

      - name: Extract and split tipitaka_pali.db
        run: |
          set -euo pipefail
          cd assets/database
          tar -xjf tipitaka_pali.db.tar.bz2
          rm tipitaka_pali.db.tar.bz2
          chmod +x split.sh
          ./split.sh

      - name: Check database parts match pubspec.yaml
        run: |
          set -euo pipefail
          grep -oE 'assets/database/[a-z_]+_part\.[a-z]+' pubspec.yaml | sort > expected.txt
          ls assets/database/*_part.* | sort > actual.txt
          if ! diff expected.txt actual.txt; then
            echo "::error::Database parts in the release do not match pubspec.yaml (< pubspec, > release)"
            exit 1
          fi
          rm expected.txt actual.txt

      - name: Check database parts match SHA256SUMS
        run: |
          set -euo pipefail
          cd assets/database
          # The checkout gave the list Windows line endings.
          tr -d '\r' < SHA256SUMS | sha256sum -c -

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate .env File for Envied
        run: |
          cat <<EOF > .env
          FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}"
          OPEN_ROUTER_API_KEY="${{ secrets.OPEN_ROUTER_API_KEY }}"
          DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
          EOF

      - name: Run Build Runner (Envied CodeGen)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate Localization
        run: flutter gen-l10n

      - name: Build Windows
        run: flutter build windows --release

      # Windows does not always have the C++ runtime, so the package brings
      # its own, from this machine. The build brings no SQLite either, so the
      # official sqlite.org DLL (with FTS5) is added, at a fixed version.
      - name: Add the C++ runtime and SQLite
        run: |
          set -euo pipefail
          REL=build/windows/x64/runner/Release
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$dll" "$REL/"
          done
          curl -fsSLo sqlite.zip https://www.sqlite.org/2025/sqlite-dll-win-x64-3500400.zip
          echo "56b8751cdbf6dcd8ac9a35508039e456692a402bc5ddf576c2b0eddb0fed8536  sqlite.zip" | sha256sum -c -
          unzip -o sqlite.zip sqlite3.dll -d "$REL"
          rm sqlite.zip
          ls -l "$REL"

      - name: Create the Store package
        run: |
          set -euo pipefail
          dart run msix:create --build-windows false --output-path build/store --output-name tipitaka
          ls -l build/store

      # The same build, signed with the msix tool's test certificate so it
      # installs outside the Store. Windows trusts it only once its
      # certificate is in Trusted People, so that comes with it.
      - name: Create the test package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          (Get-Content pubspec.yaml) -replace '^  store: true', '  store: false' | Set-Content pubspec.yaml
          dart run msix:create --build-windows false --install-certificate false --output-path build/test --output-name tipitaka-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git checkout pubspec.yaml
          $pfx = Get-ChildItem "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev\msix-*\lib\assets\test_certificate.pfx" | Select-Object -Last 1
          $cert = Get-PfxCertificate -FilePath $pfx.FullName -Password (ConvertTo-SecureString 1234 -AsPlainText -Force)
          Export-Certificate -Cert $cert -FilePath build/test/msix-testing.cer | Out-Null
          @"
          Test build of Tipitaka Pali Reader, not for the Store.

          Once on each computer, in PowerShell as administrator, in this folder:
            Import-Certificate -FilePath msix-testing.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople

          Then double-click tipitaka-test.msix and Install. It sits beside the
          Store copy; remove it in Settings > Apps when done.
          "@ | Set-Content build/test/README.txt
          Get-ChildItem build/test

      - name: Version
        id: version
        run: |
          echo "msix=$(grep -oE 'msix_version: [0-9.]+' pubspec.yaml | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Keep the Store package
        uses: actions/upload-artifact@v4
        with:
          name: store-msix-${{ steps.version.outputs.msix }}
          path: build/store/tipitaka.msix
          retention-days: 30

      - name: Keep the test package
        uses: actions/upload-artifact@v4
        with:
          name: test-msix-${{ steps.version.outputs.msix }}
          path: build/test/
          retention-days: 30

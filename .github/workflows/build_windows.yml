name: Build Windows (MSIX & Store Upload)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows-msix:
    name: Build Windows & Submit to Store
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      # --- 1. DOWNLOAD DATABASE ---
      - name: Download database zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets/database" | Out-Null
          $url = "https://www.dropbox.com/scl/fi/18cwqb6hyr81ws6n8aeyh/tipitaka_pali.db.zip?rlkey=lpiuyk3amqm9hrxpq007sb45m&st=ktchca1x&dl=1"
          Invoke-WebRequest -Uri $url -OutFile "assets/database/tipitaka_pali.db.zip"

      - name: Extract database zip
        shell: pwsh
        run: |
          Expand-Archive -Path "assets/database/tipitaka_pali.db.zip" -DestinationPath "assets/database" -Force
          Remove-Item "assets/database/tipitaka_pali.db.zip" -Force

      # --- 2. SPLIT DATABASE (BASH) ---
      - name: Run split.sh
        shell: bash
        run: |
          set -euo pipefail
          cd assets/database
          chmod +x split.sh
          ./split.sh
          ls -l tipitaka_pali_part.* || true

      # --- 3. DEPENDENCIES & ENVIED KEY INJECTION ---
      - name: Install Dependencies
        run: flutter pub get

      - name: Generate .env File for Envied
        shell: bash
        run: |
          cat <<EOF > .env
          FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}"
          OPEN_ROUTER_API_KEY="${{ secrets.OPEN_ROUTER_API_KEY }}"
          DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
          EOF

      - name: Run Build Runner (Envied CodeGen)
        run: dart run build_runner build --delete-conflicting-outputs

      # --- 4. FLUTTER BUILD WINDOWS (WITH MSVC COROUTINE SILENCE FLAG) ---
      - name: Flutter build (Windows)
        run: |
          flutter gen-l10n
          flutter build windows --release --extra-front-end-options=--no-implicit-casts 2>&1
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"

      # --- 5. EXTRA DLLs INJECTION ---
      - name: Download extra DLLs and extract into Release
        shell: pwsh
        run: |
          $dllUrl = "https://www.dropbox.com/scl/fi/snreunqjw24o14erk369l/dlls.tar.gz?rlkey=yu93hvb4l4zf8jl1wv6vuftxk&st=hxvd9iwa&dl=1"
          Invoke-WebRequest -Uri $dllUrl -OutFile "dlls.tar.gz"

          if (Test-Path "build/windows/x64/runner/Release") {
            $releaseDir = "build/windows/x64/runner/Release"
          } elseif (Test-Path "build/windows/runner/Release") {
            $releaseDir = "build/windows/runner/Release"
          } else {
            throw "Windows Release directory not found. Did the build step succeed?"
          }

          Write-Host "Using Release dir: $releaseDir"
          tar -xzf "dlls.tar.gz" -C $releaseDir
          Remove-Item "dlls.tar.gz" -Force

      # --- 6. LEGACY MSIX PATH COPY ---
      - name: Prepare MSIX input path
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $dst = "build/windows/runner/Release"

          if (Test-Path $src) {
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Copy-Item -Recurse -Force "$src\*" "$dst\"
            Write-Host "Copied files to legacy msix path:"
            Get-ChildItem $dst
          }

      # --- 7. CREATE MSIX PACKAGE ---
      - name: Create MSIX Package
        run: dart run msix:create --build-windows false --output-path build/msix --output-name tipitaka

      # --- 8. SETUP OFFICIAL MSSTORE CLI ---
      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.3

      # --- 9. UPLOAD TO MICROSOFT STORE ---
      - name: Publish MSIX to Microsoft Store
        run: |
          msstore reconfigure --tenantId ${{ secrets.MS_STORE_TENANT_ID }} --clientId ${{ secrets.MS_STORE_CLIENT_ID }} --clientSecret ${{ secrets.MS_STORE_CLIENT_SECRET }}
          msstore publish --productId ${{ secrets.MS_STORE_APP_ID }} --packagePath build/msix/tipitaka.msix

      # --- 10. ARTIFACT UPLOADS ---
      - name: Upload MSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: build/msix/*.msix

      - name: Upload Windows Release Folder
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

// Load keystore properties conditionally
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasKeystore = false

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasKeystore = true
}

android {
    namespace "com.paauk.tipitakapalireader"
    compileSdk = 36
    ndkVersion "29.0.13599879"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.paauk.tipitakapalireader"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    // DataStore (via shared_preferences_android) ships this library built
    // with NDK r27, which Play flags for 16 KB devices. It serves only
    // multi-process DataStore; the app uses SharedPreferences.getInstance(),
    // which never loads it.
    packaging {
        jniLibs {
            excludes += ['**/libdatastore_shared_counter.so']
        }
    }

    buildTypes {
        release {
            // Enable code shrinking, obfuscation, and optimization for the release build type.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')

            if (hasKeystore) {
                signingConfig signingConfigs.release
            } else {
                println("⚠️ No keystore found. Release APK will be unsigned.")
            }
        }
    }
}

flutter {
    source = "../.."
}
